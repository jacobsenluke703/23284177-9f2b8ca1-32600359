<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>Alarm clock images</title>
<style>body{font-family:sans-serif;max-width:520px;margin:12px auto;padding:0 12px}
canvas{width:100%;image-rendering:pixelated;background:#000;border:1px solid #888;margin:8px 0}
label{display:block;margin:8px 0}button{padding:10px 14px;margin:4px 4px 4px 0;font-size:16px}</style></head><body>
<h2>Wake-up image</h2>
<input type=file id=f accept="image/*">
<canvas id=cv width=128 height=64></canvas>
<label>Threshold <input type=range id=th min=20 max=235 value=128></label>
<label><input type=checkbox id=dt checked> Dither</label>
<label><input type=checkbox id=iv> Invert (swap light and dark)</label>
<label><input type=checkbox id=st checked> Keep bottom 12px free for the clock strip</label>
<label>Use as
<select id=ty><option value=d>Every year on a date</option><option value=r>One day only</option><option value=p>Pool slot (0-99)</option></select></label>
<label><input type=date id=dd><input type=number id=ps min=0 max=99 value=0 style="display:none"></label>
<button onclick=up()>Upload to clock</button><button onclick=dl()>Download .bin</button>
<p id=msg></p>
<p>Message for the morning (used only if no image is set for that date):</p>
<label>Message for <input type=date id=td> <input id=tm maxlength=40 placeholder="Morning gorgeous|wake up!" style="width:60%"></label>
<button onclick=upText()>Save message</button>
<p id=tmsg></p>
<h2>Clock display</h2>
<label>Clock number style <select id=fnt onchange=setFont()></select></label>
<p id=fmsg></p>
<h2>Alarm sounds</h2>
<p>Any audio file (mp3, wav, m4a), up to 20 s each. A sound loops while the alarm rings, so end it with a short pause. Several files at once is fine.</p>
<input type=file id=sf accept="audio/*" multiple>
<label>Name (single file only) <input id=sn maxlength=10></label>
<button onclick=upSnd()>Upload sound(s)</button>
<p id=sm></p>
<ul id=sl></ul>
<script>
const $=id=>document.getElementById(id);
let img=null,bytes=new Uint8Array(1024);
$('dd').value=new Date(Date.now()+864e5).toISOString().slice(0,10);
$('f').onchange=e=>{const i=new Image();i.onload=()=>{img=i;draw()};i.src=URL.createObjectURL(e.target.files[0])};
['th','dt','iv','st'].forEach(k=>$(k).oninput=draw);
$('ty').onchange=()=>{const p=$('ty').value=='p';$('ps').style.display=p?'':'none';$('dd').style.display=p?'none':''};
function draw(){
  const c=$('cv'),x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,128,64);
  if(!img)return;
  const H=$('st').checked?52:64;
  const s=Math.max(128/img.width,H/img.height),w=img.width*s,h=img.height*s;
  x.save();x.beginPath();x.rect(0,0,128,H);x.clip();
  x.drawImage(img,(128-w)/2,(H-h)/2,w,h);x.restore();
  const d=x.getImageData(0,0,128,64),g=new Float32Array(8192),t=+$('th').value;
  for(let i=0;i<8192;i++){let v=0.299*d.data[i*4]+0.587*d.data[i*4+1]+0.114*d.data[i*4+2];g[i]=$('iv').checked?255-v:v}
  for(let y=H;y<64;y++)for(let xx=0;xx<128;xx++)g[y*128+xx]=0;
  const dith=$('dt').checked;
  for(let y=0;y<64;y++)for(let xx=0;xx<128;xx++){
    const i=y*128+xx,o=g[i],n=o<t?0:255;g[i]=n;
    if(dith){const e=o-n;
      if(xx<127)g[i+1]+=e*7/16;
      if(y<63){if(xx>0)g[i+127]+=e*3/16;g[i+128]+=e*5/16;if(xx<127)g[i+129]+=e/16}}
  }
  bytes.fill(0);
  for(let y=0;y<64;y++)for(let b=0;b<16;b++){let v=0;
    for(let k=0;k<8;k++)if(g[y*128+b*8+k]>=128)v|=1<<k;
    bytes[y*16+b]=v}
  for(let i=0;i<8192;i++){const l=g[i]>=128?255:0;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=l;d.data[i*4+3]=255}
  x.putImageData(d,0,0);
}
function nm(){
  const t=$('ty').value;
  if(t=='p')return 'p'+String(+$('ps').value).padStart(3,'0')+'.bin';
  const d=$('dd').value;if(!d)return null;
  const a=d.split('-');
  return t=='d'?'d'+a[1]+a[2]+'.bin':'r'+a[0]+a[1]+a[2]+'.bin';
}
async function loadFonts(){
  try{
    const t=await(await fetch('/fonts')).text();
    const lines=t.split('\n').filter(x=>x);
    const cur=+lines.find(x=>x.startsWith('current=')).split('=')[1];
    const names=lines.filter(x=>!x.startsWith('current='));
    $('fnt').innerHTML=names.map((n,i)=>'<option value='+i+(i==cur?' selected':'')+'>'+n+'</option>').join('');
  }catch(e){}
}
async function setFont(){
  try{await fetch('/setfont?i='+$('fnt').value);$('fmsg').textContent='Saved'}
  catch(e){$('fmsg').textContent='Failed - are you on the clock\'s wifi?'}
}
$('td').value=new Date(Date.now()+864e5).toISOString().slice(0,10);
async function upText(){
  const d=$('td').value,m=$('tm').value.trim();
  if(!d||!m){$('tmsg').textContent='Pick a date and type a message first';return}
  const a=d.split('-');
  try{
    const r=await fetch('/settext?d='+a[0]+a[1]+a[2]+'&m='+encodeURIComponent(m));
    $('tmsg').textContent=await r.text();
  }catch(e){$('tmsg').textContent='Failed - are you on the clock\'s wifi?'}
}
loadFonts();
async function up(){
  const n=nm();
  if(!n||!img){$('msg').textContent='Pick an image and a date first';return}
  const fd=new FormData();fd.append('f',new Blob([bytes]),n);
  try{const r=await fetch('/upload',{method:'POST',body:fd});$('msg').textContent=await r.text()}
  catch(e){$('msg').textContent='Upload failed - are you on the clock\'s wifi?'}
}
function dl(){
  const n=nm();
  if(!n||!img){$('msg').textContent='Pick an image and a date first';return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));
  a.download=n.slice(1);a.click();
}
function cleanName(s){return s.replace(/\.[^.]*$/,'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,10)}
async function ls(){
  try{const t=await(await fetch('/sounds')).text();
    $('sl').innerHTML=t.split('\n').filter(x=>x).map(n=>'<li>'+n+' <button onclick="del(\''+n+'\')">delete</button></li>').join('')}
  catch(e){}
}
async function del(n){await fetch('/delsound?name='+n);ls()}
async function upSnd(){
  const fs=[...$('sf').files];
  if(!fs.length){$('sm').textContent='Choose audio file(s) first';return}
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  for(const f of fs){
    const nm=(fs.length==1&&$('sn').value)?cleanName($('sn').value):cleanName(f.name);
    if(!nm){$('sm').textContent='Bad name for '+f.name;continue}
    $('sm').textContent='Converting '+f.name+'...';
    try{
      const buf=await ctx.decodeAudioData(await f.arrayBuffer());
      const len=Math.floor(Math.min(buf.duration,20)*16000);
      const oc=new OfflineAudioContext(1,len,16000);
      const s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();
      const d=(await oc.startRendering()).getChannelData(0);
      let pk=0.001;for(let i=0;i<len;i++)pk=Math.max(pk,Math.abs(d[i]));
      const g=0.95/pk,b=new Uint8Array(len);
      for(let i=0;i<len;i++)b[i]=Math.max(0,Math.min(255,Math.round(d[i]*g*127+128+Math.random()-Math.random())));
      const fd=new FormData();fd.append('f',new Blob([b]),'s'+nm+'.raw');
      const r=await fetch('/upload',{method:'POST',body:fd});
      $('sm').textContent=nm+': '+await r.text();
    }catch(e){$('sm').textContent='Failed: '+f.name+' ('+e.message+')'}
  }
  ls();
}
ls();
</script></body></html>
